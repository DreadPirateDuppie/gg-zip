<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMGL Media</title>
<meta name="description" content="Street portraits, printed in your hand.">
<meta name="theme-color" content="#0a0a09">

<meta property="og:title" content="RMGL Media">
<meta property="og:description" content="Street portraits, printed in your hand.">
<meta property="og:image" content="img/hero.jpg">
<meta property="og:type" content="website">

<style>
  :root{
    --bg:#0a0a09;
    --ink:#f0efec;
    --dim:#8f8e89;
    --line:#232320;
    --accent:#00ff41;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;flex-direction:column;
  }

  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}

  /* ---- the photograph does the talking ---- */
  .top{
    position:relative;
    flex:1 1 auto;
    min-height:44svh;
    display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;
  }
  .top img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;object-position:center 28%;
  }
  .top::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,
      rgba(8,8,7,.45) 0%,
      rgba(8,8,7,.05) 34%,
      rgba(8,8,7,.62) 78%,
      var(--bg) 100%);
  }
  .brand{
    position:relative;z-index:2;
    text-align:center;
    padding:0 24px 30px;
  }
  .brand h1{
    font-size:clamp(1.35rem,6.2vw,1.95rem);
    font-weight:500;
    letter-spacing:0.16em;
    text-indent:0.16em;
  }
  .brand p{
    margin-top:14px;
    font-size:0.95rem;
    line-height:1.6;
    color:#d6d5d0;
  }

  /* ---- links ---- */
  .body{
    flex:0 0 auto;
    width:100%;max-width:420px;
    margin:0 auto;
    padding:26px 24px calc(34px + env(safe-area-inset-bottom));
  }

  .links{display:flex;flex-direction:column;gap:11px}

  a.link{
    display:flex;align-items:center;justify-content:center;gap:11px;
    min-height:62px;padding:18px 22px;
    border:1px solid var(--line);border-radius:15px;
    background:#141413;
    font-size:1.04rem;font-weight:600;letter-spacing:0.01em;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .25s ease, background .25s ease;
  }
  a.link:hover{border-color:#3a3a35;background:#191917}
  a.link:active{transform:translateY(1px)}

  a.link.primary{
    background:var(--accent);color:#03170a;border-color:var(--accent);
  }
  a.link.primary:hover{background:#5cff85;border-color:#5cff85}

  a.link svg{width:20px;height:20px;flex:none}

  footer{
    margin-top:30px;padding-top:24px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  footer .n{
    font-size:0.84rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--dim);line-height:1.8;
  }
  footer .p{margin-top:6px;font-size:0.86rem;color:#5f5e5a}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <img src="img/hero.jpg" width="926" height="1400" alt="">
  <div class="brand">
    <h1>RMGL Media</h1>
    <p>Street portraits, printed in your hand.</p>
  </div>
</div>

<div class="body">
  <nav class="links">

    <a class="link primary" href="menu.html">Prices &amp; what I do</a>

    <a class="link" href="portfolio/index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2.5"/>
        <circle cx="8.6" cy="9.4" r="1.7"/>
        <path d="M3.4 17l4.8-4.6 3.6 3.3 3.1-2.7 5.7 5"/>
      </svg>
      The portfolio (29 shots)
    </a>

    <a class="link" href="https://instagram.com/gg.zip" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      @gg.zip
    </a>

    <a class="link" href="qr.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h3v3h-3zM20 14h1M14 20h3M20 17v4"/>
      </svg>
      Show the QR code
    </a>

    <!-- ADD MORE LINKS HERE — copy a block above.
         The QR points at this page, so this list can change freely
         without ever reprinting anything. -->

  </nav>

  <footer>
    <div class="n">Roaming Media Group London</div>
  </footer>
</div>

</body>
</html>
