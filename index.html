<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGL Media</title>
<meta name="description" content="Street portraits, printed in your hand. South London.">
<meta name="theme-color" content="#111110">

<meta property="og:title" content="MGL Media">
<meta property="og:description" content="Street portraits, printed in your hand.">
<meta property="og:type" content="website">

<style>
  :root{
    --bg:#111110;
    --bg-2:#191917;
    --line:#2b2b28;
    --ink:#f4f1ea;
    --ink-dim:#a29d95;
    --accent:#e8c547;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px 22px calc(40px + env(safe-area-inset-bottom));
  }

  .card{width:100%;max-width:400px;text-align:center}

  h1{
    font-size:2.1rem;font-weight:700;letter-spacing:-0.03em;
  }
  .tag{
    margin-top:10px;color:var(--ink-dim);font-size:1.02rem;
  }

  .links{margin-top:34px;display:flex;flex-direction:column;gap:11px}

  a.link{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:60px;padding:18px 20px;
    border:1px solid var(--line);border-radius:14px;
    background:var(--bg-2);
    color:var(--ink);text-decoration:none;
    font-size:1.06rem;font-weight:650;
    -webkit-tap-highlight-color:transparent;
  }
  a.link:active{transform:translateY(1px)}

  /* The main action — the thing you actually want them to open */
  a.link.primary{
    background:var(--accent);color:#141400;border-color:var(--accent);
  }

  a.link svg{width:20px;height:20px;flex:none}

  footer{
    margin-top:30px;color:var(--ink-dim);font-size:0.85rem;
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main class="card">

  <h1>MGL Media</h1>
  <p class="tag">Street portraits, printed in your hand.<br>South London.</p>

  <nav class="links">

    <a class="link primary" href="menu.html">
      Prices &amp; what I do
    </a>

    <a class="link" href="https://instagram.com/gg.zip" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      @gg.zip
    </a>

    <!-- ADD MORE LINKS HERE — copy the block above.
         Nothing here should ever need reprinting: the QR
         points at this page, so this list can change freely. -->

  </nav>

  <footer>Peckham, London</footer>

</main>

</body>
</html>
