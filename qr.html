<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMGL Media — scan me</title>
<meta name="theme-color" content="#ffffff">
<style>
  /* Deliberately WHITE, not the site's dark theme.
     QR scanners need a light background and a quiet zone —
     an inverted code often fails to read. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#fff;color:#111110;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:22px;padding:26px;
    text-align:center;
  }
  .kicker{
    font-size:0.84rem;letter-spacing:0.12em;text-transform:uppercase;
    color:#8d8880;font-weight:600;line-height:1.7;
  }
  h1{font-size:1.5rem;font-weight:600;letter-spacing:-0.015em}
  p{font-size:1.02rem;line-height:1.6;color:#66635d;margin-top:-8px}
  img{
    width:min(74vw,66vh,440px);
    height:auto;
    image-rendering:pixelated; /* keeps modules crisp when scaled */
  }
  .links{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  a{
    font-size:0.98rem;font-weight:550;color:#111110;text-decoration:none;
    border:1px solid #ddd9d3;border-radius:11px;
    padding:13px 20px;min-height:46px;
  }
  a.quiet{border:0;color:#9a958d;padding:4px;min-height:0}
</style>
</head>
<body>
  <p class="kicker">Everything</p>
  <h1>Point your camera here</h1>
  <p>Prices, work &amp; socials</p>

  <img src="qr.png" alt="QR code to RMGL Media">

  <div class="links">
    <a href="index.html">Back to Hub &rarr;</a>
  </div>
</body>
</html>
