<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gg.zip — scan me</title>
<meta name="theme-color" content="#ffffff">
<style>
  /* Deliberately WHITE, not the site's dark theme.
     QR scanners need a light background and a quiet zone —
     an inverted code often fails to read. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#fff;color:#111110;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:22px;padding:24px;
    text-align:center;
  }
  img{
    width:min(78vw,78vh,460px);
    height:auto;
    image-rendering:pixelated; /* keeps modules crisp when scaled up */
  }
  h1{font-size:1.35rem;letter-spacing:-0.02em}
  p{font-size:1rem;color:#6b6862;margin-top:-14px}
  a{
    margin-top:6px;font-size:0.9rem;color:#6b6862;text-decoration:none;
    border-bottom:1px solid #d8d5cf;padding-bottom:2px;
  }
</style>
</head>
<body>
  <h1>Point your camera here</h1>
  <p>Prices &amp; recent work</p>
  <img src="qr.png" alt="QR code linking to gg.zip street portraits">
  <a href="index.html">&larr; back to the menu</a>
</body>
</html>
