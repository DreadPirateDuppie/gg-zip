<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@gg.zip — scan me</title>
<meta name="theme-color" content="#ffffff">
<style>
  /* Same white treatment as qr.html — scanners need a light field. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#fff;color:#111110;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:18px;padding:24px;
    text-align:center;
  }
  .kicker{
    font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;
    color:#9a958d;font-weight:600;
  }
  h1{font-size:1.35rem;letter-spacing:-0.02em}
  p{font-size:1rem;color:#6b6862;margin-top:-10px}
  img{
    width:min(74vw,66vh,440px);
    height:auto;
    image-rendering:pixelated;
  }
  .links{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  a{
    font-size:0.95rem;color:#111110;text-decoration:none;
    border:1px solid #ddd9d3;border-radius:11px;
    padding:13px 20px;min-height:46px;
  }
  a.quiet{border:0;color:#9a958d;padding:4px;min-height:0}
</style>
</head>
<body>
  <p class="kicker">The work</p>
  <h1>Point your camera here</h1>
  <p>@gg.zip &mdash; straight to the portfolio</p>

  <img src="qr-social.png" alt="QR code to the gg.zip Instagram">

  <div class="links">
    <a href="qr.html">Prices &amp; everything &rarr;</a>
    <a class="quiet" href="index.html">back</a>
  </div>
</body>
</html>
