<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMGL Media — the work</title>
<meta name="description" content="Photography. Portfolio and Instagram.">
<meta name="theme-color" content="#0a0a09">

<meta property="og:title" content="RMGL Media — the work">
<meta property="og:description" content="Photography.">
<meta property="og:image" content="img/01.jpg">
<meta property="og:type" content="website">

<style>
  :root{
    --bg:#0a0a09;
    --ink:#f0efec;
    --dim:#8f8e89;
    --line:#232320;
    --accent:#00ff41;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    /* room for the fixed bar */
    padding-bottom:calc(154px + env(safe-area-inset-bottom));
  }

  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:auto}

  header{
    padding:30px 20px 22px;
    text-align:center;
  }
  header .mark{
    font-size:1.05rem;font-weight:500;
    letter-spacing:0.2em;text-indent:0.2em;
  }
  header .sub{
    margin-top:9px;
    font-size:0.84rem;letter-spacing:0.13em;text-transform:uppercase;
    color:var(--dim);
  }

  /* ---- the work, straight away ---- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;
  }
  @media(min-width:760px){
    .grid{grid-template-columns:repeat(3,1fr);max-width:1100px;margin:0 auto;gap:4px}
  }
  .grid img{
    aspect-ratio:2/3;
    object-fit:cover;
    background:#141413;
  }

  /* ---- the two choices, always reachable ---- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(10,10,9,.93);
    backdrop-filter:saturate(150%) blur(14px);
    -webkit-backdrop-filter:saturate(150%) blur(14px);
    border-top:1px solid var(--line);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .bar .inner{
    max-width:420px;margin:0 auto;
    display:flex;flex-direction:column;gap:9px;
  }
  a.link{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:56px;padding:15px 20px;
    border:1px solid var(--line);border-radius:14px;
    background:#141413;
    font-size:1.02rem;font-weight:600;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .25s ease, background .25s ease;
  }
  a.link:hover{border-color:#3a3a35;background:#191917}
  a.link:active{transform:translateY(1px)}
  a.link.primary{background:var(--accent);color:#03170a;border-color:var(--accent)}
  a.link.primary:hover{background:#5cff85;border-color:#5cff85}
  a.link svg{width:19px;height:19px;flex:none}

  footer{
    padding:26px 20px 8px;text-align:center;
  }
  footer a{
    font-size:0.84rem;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--dim);
  }
  footer a:hover{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="mark">RMGL Media</div>
  <div class="sub">Photography</div>
</header>

<div class="grid">
  <img src="img/01.jpg" width="530" height="800" alt="">
  <img src="img/02.jpg" width="530" height="800" alt="">
  <img src="img/03.jpg" width="530" height="800" alt="">
  <img src="img/06.jpg" width="800" height="530" loading="lazy" alt="">
  <img src="img/04.jpg" width="530" height="800" loading="lazy" alt="">
  <img src="img/07.jpg" width="530" height="800" loading="lazy" alt="">
</div>

<div class="bar">
  <div class="inner">
    <a class="link primary" href="menu.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Prints &amp; prices
    </a>
    <a class="link" href="https://instagram.com/gg.zip" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      @gg.zip
    </a>
  </div>
</div>

</body>
</html>
